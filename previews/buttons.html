<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buttons — Defend Jerusalem DS</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/dj.css">
</head>
<body style="padding:28px">
  <p style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px">
    <a class="btn-give" href="#">Donate</a>
    <a class="btn-primary" href="#">Start reading</a>
    <a class="btn-quiet" href="#">Download PDF</a>
  </p>
  <div class="on-dark" style="background:var(--navy-deep);padding:22px;border-radius:4px">
    <p style="display:flex;gap:14px;flex-wrap:wrap;align-items:center">
      <a class="btn-gold" href="#">Start reading</a>
      <a class="btn-ghost" href="#">Read the latest report</a>
    </p>
  </div>
  <p class="ds-note">Red is reserved for giving. Targets ≥44px. Focus rings always visible.</p>
</body>
</html>
